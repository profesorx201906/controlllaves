# =========================================================
# Configuración exclusiva para pruebas locales
# =========================================================

# Carga las variables guardadas en .env.local.
# El archivo está en la raíz del proyecto.
spring.config.import=optional:file:.env.local[.properties]

# Flyway valida y aplica las migraciones sobre la BD local.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Hibernate solamente valida el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Evita que la prueba falle porque el servidor SMTP
# no esté disponible temporalmente.
management.health.mail.enabled=false

# =========================================================
# Notificaciones de incidencias
# =========================================================

# Evita que las pruebas automáticas envíen correos reales.
app.notification.processing-enabled=false

# Las pruebas no deben crear usuarios reales en MariaDB.
app.bootstrap.admin.enabled=false

# Clave exclusiva para pruebas automatizadas.
# No debe utilizarse fuera del perfil test.
app.security.jwt.issuer=prestamo-llaves-api-test
app.security.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.security.jwt.access-token-ttl=PT5M