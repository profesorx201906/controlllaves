# =========================================================
# Aplicación
# =========================================================

spring.application.name=prestamo-llaves-api

server.port=${SERVER_PORT:8080}

# Evita exponer excepciones internas al cliente.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# =========================================================
# Base de datos MariaDB
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/prestamo_llaves}
spring.datasource.username=${DB_USERNAME:prestamo_app}
spring.datasource.password=${DB_PASSWORD}

# Configuración del pool de conexiones HikariCP.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000


# =========================================================
# JPA e Hibernate
# =========================================================

# Evita mantener sesiones JPA abiertas durante la respuesta HTTP.
spring.jpa.open-in-view=false

# Flyway administrará el esquema; Hibernate solo lo validará.
spring.jpa.hibernate.ddl-auto=validate

# Las fechas se almacenarán internamente en UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =========================================================
# Migraciones Flyway
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Comprueba que las migraciones aplicadas no hayan cambiado.
spring.flyway.validate-on-migrate=true

# Impide borrar accidentalmente el esquema mediante Flyway clean.
spring.flyway.clean-disabled=true

# No utilizar schema.sql ni data.sql.
spring.sql.init.mode=never
# =========================================================
# Correo SMTP
# =========================================================

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Evita bloquear indefinidamente los hilos ante errores SMTP.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# Actuator y observabilidad
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# No mostrar detalles internos de salud a usuarios anónimos.
management.endpoint.health.show-details=never


# =========================================================
# Seguridad JWT
# =========================================================

app.security.jwt.issuer=${JWT_ISSUER:prestamo-llaves-api}
app.security.jwt.secret-base64=${JWT_SECRET_BASE64}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}


# =========================================================
# Administrador inicial
# =========================================================

app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Administrador inicial}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}


# =========================================================
# Notificaciones
# =========================================================

app.notification.administrator-email=${ADMIN_NOTIFICATION_EMAIL}

# Temporal: deshabilitar comprobación SMTP durante el desarrollo inicial.
management.health.mail.enabled=false
management.endpoint.health.show-components=never


# Dirección que recibirá los reportes.

# Remitente visible del correo.
app.notification.from-email=${NOTIFICATION_FROM_EMAIL:${SMTP_USERNAME}}

# Prefijo utilizado en el asunto.
app.notification.subject-prefix=${NOTIFICATION_SUBJECT_PREFIX:[Préstamo de llaves]}

# Activa el procesador programado.
app.notification.processing-enabled=${NOTIFICATION_PROCESSING_ENABLED:true}

# Espera inicial después de arrancar la aplicación.
app.notification.initial-delay-ms=${NOTIFICATION_INITIAL_DELAY_MS:10000}

# Tiempo entre ciclos. fixedDelay cuenta desde la finalización
# del ciclo anterior.
app.notification.processing-delay-ms=${NOTIFICATION_PROCESSING_DELAY_MS:30000}

# Máximo total de intentos por incidencia.
app.notification.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:5}

